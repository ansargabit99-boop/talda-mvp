<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: methodologist workbench — fixed left rail of views, one working canvas; the data is the hero. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --sunk:#e9eff1; --ink:#13232b; --muted:#5a6c75; --line:#d9e2e6;
  --accent:#0b7aa0; --accent-ink:#ffffff;
  --good:#2f8a57; --warn:#c98a10; --bad:#c2412d;
  --c-a:#0b7aa0; --c-b:#7a4fc4; --c-c:#c27a0e;
  --f-display:"Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body:"Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1518; --surface:#141f24; --sunk:#0f191d; --ink:#e2ebee; --muted:#93a5ad; --line:#24343b;
  --accent:#4bb6da; --accent-ink:#06171d;
  --good:#5cbf85; --warn:#e3a73a; --bad:#ec6b55;
  --c-a:#4bb6da; --c-b:#a988e8; --c-c:#e3a73a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1518; --surface:#141f24; --sunk:#0f191d; --ink:#e2ebee; --muted:#93a5ad; --line:#24343b;
  --accent:#4bb6da; --accent-ink:#06171d;
  --good:#5cbf85; --warn:#e3a73a; --bad:#ec6b55;
  --c-a:#4bb6da; --c-b:#a988e8; --c-c:#e3a73a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding-block:20px 48px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;color:var(--accent)}
.brand span{font-size:12.5px;color:var(--muted);line-height:1.35}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--sunk)}
nav a.on{background:var(--accent);color:var(--accent-ink)}
nav a .cnt{font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--bad);color:#fff}
nav a.on .cnt{background:var(--accent-ink);color:var(--accent)}
.demo-badge{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;line-height:1.4}
.demo-badge strong{color:var(--ink)}
main{min-width:0;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,2.6vw,30px);line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:0}
p{margin:0}
.lede{color:var(--muted);max-width:72ch}
.head{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.num,td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:600;text-align:left;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
.heat td.h{text-align:center;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;border:2px solid var(--surface);border-radius:4px;min-width:46px}
.heat th{white-space:normal;vertical-align:bottom;font-size:11.5px;min-width:46px}
.heat td.t{white-space:nowrap;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.sev-high{background:color-mix(in oklab,var(--bad) 18%,var(--surface));color:var(--bad)}
.sev-mid{background:color-mix(in oklab,var(--warn) 20%,var(--surface));color:color-mix(in oklab,var(--warn) 70%,var(--ink))}
.sev-low{background:var(--sunk);color:var(--muted)}
.ok{color:var(--good)} .no{color:var(--bad)}
.tb{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.btn{font:inherit;font-weight:600;font-size:13.5px;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,a:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.summary{font-size:15.5px;line-height:1.6;max-width:78ch;display:flex;flex-direction:column;gap:10px}
.summary b{font-weight:600}
.issue{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.issue.high{border-left-color:var(--bad)} .issue.mid{border-left-color:var(--warn)} .issue.low{border-left-color:var(--muted)}
.issue ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.issue .act{background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px}
.issue .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.topiclist{display:flex;flex-direction:column;gap:2px}
.topiclist button{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 92px 40px;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;font-size:14px}
.topiclist button:hover{background:var(--sunk)}
.topiclist button.on{background:color-mix(in oklab,var(--accent) 14%,var(--surface));font-weight:600}
.topiclist button:focus-visible{outline:2px solid var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
.mis{display:flex;flex-direction:column;gap:12px}
.mis .m{display:flex;flex-direction:column;gap:5px}
.mis .m .top{display:flex;justify-content:space-between;gap:12px}
.ex{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number],input[type=text]{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:120px}
.note{font-size:13px;color:var(--muted);max-width:80ch}
svg text{fill:var(--ink);font-family:var(--f-body)}
svg .mut{fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.vbars{display:flex;flex-direction:column;gap:8px}
.vbars .r{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13.5px}
.toast{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px}
textarea{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);padding:10px}
@media (max-width:980px){ .split{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .grid2,.cmp{grid-template-columns:1fr} }
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px;padding-block:12px 40px}
  aside{min-width:0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;gap:8px}
  .brand{flex-direction:row;align-items:baseline;gap:10px}
  .brand span{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav a{white-space:nowrap;padding:6px 10px;font-size:14px}
  .demo-badge{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
<link rel="stylesheet" href="/static/app.css">


</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>Talda</b><span>Доказательная методика: какие главы учебников работают, а какие нет</span></div>
    <nav id="nav"></nav>
    <div class="demo-badge" id="srcBadge"></div>
  </aside>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script src="/static/engine.js"></script>
<script src="/static/app.js"></script>

</body>
</html>
